<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>Battlefield Replays</title>
<style>
  :root { --panel: rgba(18, 20, 26, 0.86); --ink: #ecebe4; --muted: #a9a79c; --accent: #e3c27a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; color: var(--ink); font: 18px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #map { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #map:active { cursor: grabbing; }
  .panel { position: fixed; background: var(--panel); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; backdrop-filter: blur(6px); }
  #top { left: 16px; top: 16px; padding: 12px 16px; max-width: min(490px, calc(100vw - 32px)); }
  #top h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: 0.01em; }
  #sub { color: var(--muted); font-size: 16px; margin-top: 2px; }
  #hint { color: var(--muted); font-size: 14px; margin-top: 6px; }
  #legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 16px; }
  #legend span { display: inline-flex; align-items: center; gap: 6px; }
  #legend i { width: 16px; height: 16px; border-radius: 2px; display: inline-block; }
  #top .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  #top .row select { flex: 1; min-width: 0; }
  select, button { font: inherit; color: var(--ink); background: #262a33; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 8px 14px; min-height: 48px; }
  button { cursor: pointer; }
  button:hover, select:hover { background: #30353f; }
  #hover { padding: 12px 16px; font-size: 17px; line-height: 1.45; width: 340px; pointer-events: none; }
  #caption { right: 16px; top: 16px; transform: translateY(-8px); width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 160px); overflow-y: auto; padding: 16px 20px; opacity: 0; transition: opacity 0.4s, transform 0.4s; }
  #caption.show { opacity: 1; transform: none; }
  .nofade #caption { transition: none; }
  #cap-title { font-weight: 650; font-size: 22px; color: var(--accent); }
  #cap-text { font-size: 20px; margin-top: 6px; }
  #bar { left: 16px; right: 16px; bottom: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  #play { width: 56px; min-width: 56px; font-size: 22px; }
  #track { flex: 1; min-width: 80px; position: relative; padding-top: 12px; }
  #scrub { display: block; width: 100%; accent-color: var(--accent); height: 48px; margin: 0; }
  /* Chapter marks: ticks inside the bar, leaders up to its top edge (23 px: marks + padding + border), labels slanting over the map. */
  #marks { position: absolute; left: 8px; right: 8px; bottom: 48px; height: 12px; }
  #marks svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 23px; overflow: visible; pointer-events: none; }
  #marks path { fill: none; stroke: var(--muted); stroke-width: 1.5; } #marks path.on { stroke: var(--accent); stroke-width: 2.5; }
  #marks button { position: absolute; bottom: 23px; min-height: 0; height: 20px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; background: var(--panel); color: var(--ink); font-size: 13px; line-height: 18px; white-space: nowrap; transform-origin: 0 100%; transform: rotate(-50deg); }
  #marks button:hover, #marks button.on { color: var(--accent); } #marks button.on { border-color: var(--accent); }
  #clock { font-variant-numeric: tabular-nums; min-width: 92px; text-align: center; font-weight: 700; font-size: 20px; white-space: nowrap; }
  #bar label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #bar input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
  dialog { background: #1a1d24; color: var(--ink); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; max-width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 20px 24px; }
  dialog::backdrop { background: rgba(0,0,0,0.55); }
  dialog h2 { margin: 0 0 10px; font-size: 18px; }
  dialog li { margin: 6px 0; }
  #legend-dlg { max-width: min(900px, calc(100vw - 32px)); }
  #legend-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font-size: 16px; margin-bottom: 14px; }
  #legend-list svg { display: block; }
  #legend-hint { color: var(--muted); font-size: 15px; margin: 0 0 14px; }
  @media (min-width: 720px) { #legend-list { grid-template-columns: auto 1fr auto 1fr; } }
  @media (max-width: 640px) {
    #top { left: 12px; right: 12px; top: 12px; max-width: none; padding: 10px 12px; }
    #top h1 { font-size: 18px; } #sub { font-size: 14px; } #hint, #legend { display: none; }
    select, button { min-height: 44px; padding: 6px 10px; font-size: 16px; }
    #hover { display: none; }
    #bar { left: 12px; right: 12px; bottom: 12px; gap: 5px; padding: 8px 6px; } #bar label span { display: none; } #speed { padding: 6px 2px 6px 6px; }
    #play { width: 48px; min-width: 48px; font-size: 20px; } #clock { min-width: 0; font-size: 15px; }
    #track { min-width: 30px; padding-top: 0; } #marks { display: none; } /* no room for chapters on a phone's scrubber */
    #caption { top: auto; bottom: 88px; left: 12px; right: 12px; width: auto; max-height: 40vh; padding: 10px 14px; } #cap-title { font-size: 18px; } #cap-text { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>

<section id="top" class="panel">
  <h1 id="title">Loading…</h1>
  <div id="sub"></div>
  <div id="legend"></div>
  <div id="hint">Drag to look around, scroll or pinch to zoom. Space pauses.</div>
  <div class="row">
    <select id="battle" aria-label="Battle"></select>
    <button id="legend-btn">Legend</button>
    <button id="src-btn">Sources</button>
  </div>
</section>

<aside id="hover" class="panel" hidden></aside>

<div id="caption" class="panel">
  <div id="cap-title"></div>
  <div id="cap-text"></div>
</div>

<footer id="bar" class="panel">
  <button id="play" aria-label="Play">▶</button>
  <select id="speed" aria-label="Speed"></select>
  <div id="track"><div id="marks"></div><input id="scrub" type="range" step="1" aria-label="Battle time"></div>
  <span id="clock"></span>
  <label title="Camera follows the story"><input id="follow" type="checkbox" checked> <span>Follow the action</span></label>
  <label title="Hurry through the quiet stretches"><input id="lapse" type="checkbox" checked> <span>Time-lapse</span></label>
</footer>

<dialog id="legend-dlg">
  <h2>Legend</h2>
  <div id="legend-list"></div>
  <p id="legend-hint">Point at any unit for its name, commander, strength and what it is doing.</p>
  <form method="dialog"><button>Close</button></form>
</dialog>

<dialog id="sources">
  <h2>Sources</h2>
  <ol id="src-list"></ol>
  <form method="dialog"><button>Close</button></form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
