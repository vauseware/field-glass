name: Bug report
description: Something in the app doesn't work or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem, don't file an issue. See SECURITY.md.
  - type: input
    id: link
    attributes:
      label: Link
      description: The URL that shows the problem, with its time if you can, such as https://fieldglass.vause.io/#cowpens@07:45
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: browser
    attributes:
      label: Browser and computer
      description: For example Chrome 131 on a 2020 MacBook Air
  - type: textarea
    id: shot
    attributes:
      label: Screenshot
